<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gaming Wheel Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,700;1,700&family=Montserrat:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  width:100vw;height:100vh;overflow:hidden;
  background:#fff;
  background-image:linear-gradient(rgba(0,0,0,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.025) 1px,transparent 1px);
  background-size:44px 44px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
.result-box{height:70px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.result-text{font-family:'Chakra Petch',sans-serif;font-size:clamp(1.4rem,4.5vw,2.8rem);font-style:italic;font-weight:700;text-transform:uppercase;text-align:center}
.wheel-wrapper{position:relative;flex-shrink:0;margin:10px 0}
.ring-outer{position:absolute;inset:-12px;border-radius:50%;background:#F5D345;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.ring-inner{position:absolute;inset:-5px;border-radius:50%;background:#fff}
.canvas-wrap{position:relative;width:100%;height:100%;z-index:2}
canvas{display:block;border-radius:50%}
.arrow{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:36px solid #F5D345;z-index:30;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.center-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#F5D345;border:5px solid #fff;z-index:10}
.spin-btn{
  flex-shrink:0;padding:18px 0;width:280px;
  font-family:'Montserrat',sans-serif;font-size:2rem;font-weight:900;font-style:italic;text-transform:uppercase;
  background:#F5D345;color:#000;border:4px solid #000;cursor:pointer;
  box-shadow:0 8px 0 #000;-webkit-appearance:none;min-height:68px;margin-top:18px;
  transition:transform .12s,box-shadow .12s;
}
.spin-btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 3px 0 #000}
.spin-btn:disabled{background:#e8e8e8;color:#bbb;border-color:#ddd;box-shadow:none}
.settings-btn{position:fixed;bottom:10px;left:10px;background:none;border:none;color:#bbb;font-size:.6rem;font-family:'Montserrat',sans-serif;text-transform:uppercase;padding:12px;min-width:44px;min-height:44px;cursor:pointer;z-index:50}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;align-items:center;justify-content:center}
.overlay.open{display:flex}
.stock-panel{background:#fff;border:3px solid #F5D345;padding:24px;width:min(400px,88vw);max-height:75vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.stock-panel h3{font-size:.85rem;font-weight:900;letter-spacing:.1em;margin-bottom:16px}
.stock-rows{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.stock-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.stock-label{flex:1;font-weight:900;font-size:.8rem;text-transform:uppercase}
.stock-input{width:70px;text-align:center;border:2px solid #000;padding:8px 4px;font-size:1rem;font-family:'Montserrat',sans-serif;font-weight:900;-webkit-appearance:none;min-height:44px}
.stock-close{margin-top:16px;padding:14px;width:100%;font-family:'Montserrat',sans-serif;font-weight:900;font-size:.9rem;text-transform:uppercase;background:#000;color:#fff;border:none;cursor:pointer;min-height:50px}
.flash{animation:blink .15s step-end 8}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="result-box"><div class="result-text" id="wr-result">GIRA A RODA</div></div>
<div class="wheel-wrapper" id="wr-wrapper">
  <div class="ring-outer"></div>
  <div class="ring-inner"></div>
  <div class="canvas-wrap">
    <div class="arrow"></div>
    <canvas id="wr-canvas"></canvas>
    <div class="center-dot"></div>
  </div>
</div>
<button class="spin-btn" id="wr-btn">GIRAR</button>
<button class="settings-btn" id="wr-toggle">&#9881; Stock</button>
<div class="overlay" id="wr-overlay">
  <div class="stock-panel">
    <h3>GESTÃO DE STOCK</h3>
    <div class="stock-rows" id="wr-rows"></div>
    <button class="stock-close" id="wr-close">Fechar</button>
  </div>
</div>
<script>
(function(){
  var PRIZES=[
    {name:'NOTEBOOK',  stock:100},
    {name:'T-SHIRT',   stock:12},
    {name:'OOOPS',     stock:Infinity},
    {name:'CANECA',    stock:12},
    {name:'TOTE BAG',  stock:80},
    {name:'TRY AGAIN', stock:Infinity},
    {name:'PATINHO',   stock:60},
    {name:'NECESSAIRE',stock:70},
    {name:'OOOPS',     stock:Infinity},
    {name:'YO-YO',     stock:66},
    {name:'ABRE CAPS',       stock:100},
    {name:'TRY AGAIN', stock:Infinity}
  ];
  var canvas=document.getElementById('wr-canvas');
  var ctx=canvas.getContext('2d');
  var btn=document.getElementById('wr-btn');
  var result=document.getElementById('wr-result');
  var overlay=document.getElementById('wr-overlay');
  var toggle=document.getElementById('wr-toggle');
  var closeBtn=document.getElementById('wr-close');
  var rowsEl=document.getElementById('wr-rows');
  var wrapper=document.getElementById('wr-wrapper');
  var rotation=0,spinning=false,WPX=0;

  function calcSize(){
    var vw=window.innerWidth||document.documentElement.clientWidth||768;
    var vh=window.innerHeight||document.documentElement.clientHeight||1024;
    return Math.max(Math.floor(Math.min(vw-40,vh-220,580)),100);
  }
  function sizeWheel(){
    WPX=calcSize();
    wrapper.style.width=WPX+'px';
    wrapper.style.height=WPX+'px';
    canvas.style.width=WPX+'px';
    canvas.style.height=WPX+'px';
  }
  function getActive(){return PRIZES.filter(function(p){return p.stock===Infinity||p.stock>0});}
  function draw(){
    if(WPX<10)return;
    var dpr=Math.min(window.devicePixelRatio||1,3);
    canvas.width=WPX*dpr;canvas.height=WPX*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var items=getActive(),center=WPX/2,radius=center-2,arc=(2*Math.PI)/items.length;
    ctx.clearRect(0,0,WPX,WPX);
    items.forEach(function(item,i){
      var angle=rotation+i*arc;
      var colors=['#F5D345','#FFFFFF','#111111'];
      var fill=colors[i%3],text=fill==='#111111'?'#F5D345':'#000';
      ctx.beginPath();ctx.moveTo(center,center);
      ctx.arc(center,center,radius,angle,angle+arc);
      ctx.fillStyle=fill;ctx.fill();
      ctx.strokeStyle='#000';ctx.lineWidth=2.5;ctx.stroke();
      ctx.save();ctx.translate(center,center);ctx.rotate(angle+arc/2);
      ctx.textAlign='right';ctx.fillStyle=text;
      var fs=Math.max(11,WPX/22);
      ctx.font='italic 900 '+fs+'px Montserrat,sans-serif';
      ctx.fillText(item.name,radius-16,fs/3);
      ctx.restore();
    });
  }
  function isLocked(){
    var now=new Date();
    var unlock=new Date('2026-05-26T00:00:00');
    return now < unlock;
  }

  function spin(){
    if(spinning)return;
    var items=getActive();if(!items.length)return;
    spinning=true;btn.disabled=true;
    result.classList.remove('flash');result.textContent='A SORTEAR...';
    var t0=performance.now(),dur=4200,r0=rotation%(2*Math.PI);
    var winIdx=Math.floor(Math.random()*items.length);
    var arc=(2*Math.PI)/items.length;
    var fin=(Math.PI*2*10)+(Math.PI*1.5)-winIdx*arc-arc/2;
    var tot=fin-r0;
    (function tick(now){
      var p=Math.min((now-t0)/dur,1),ease=1-Math.pow(1-p,4);
      rotation=r0+tot*ease;draw();
      if(p<1){requestAnimationFrame(tick);}
      else{
        spinning=false;btn.disabled=false;
        var w=items[winIdx];result.textContent=w.name;result.classList.add('flash');
        if(w.stock!==Infinity && !isLocked()){w.stock--;buildStock();setTimeout(draw,600);}
      }
    })(performance.now());
  }
  function buildStock(){
    rowsEl.innerHTML='';
    PRIZES.forEach(function(p,idx){
      var row=document.createElement('div');row.className='stock-row';
      row.innerHTML='<span class="stock-label">'+p.name+'</span>'+
        '<input type="number" inputmode="numeric" class="stock-input" value="'+(p.stock===Infinity?999:p.stock)+'">';
      row.querySelector('input').addEventListener('change',function(){
        var v=parseInt(this.value);PRIZES[idx].stock=v>=999?Infinity:v;draw();
      });
      rowsEl.appendChild(row);
    });
  }
  function sp(e){e.stopPropagation();e.preventDefault();}
  btn.addEventListener('touchend',function(e){sp(e);spin();});
  btn.addEventListener('click',function(e){sp(e);spin();});
  toggle.addEventListener('touchend',function(e){sp(e);overlay.classList.add('open');});
  toggle.addEventListener('click',function(e){sp(e);overlay.classList.add('open');});
  closeBtn.addEventListener('touchend',function(e){sp(e);overlay.classList.remove('open');});
  closeBtn.addEventListener('click',function(e){sp(e);overlay.classList.remove('open');});
  overlay.addEventListener('touchend',function(e){if(e.target===overlay)overlay.classList.remove('open');});
  window.addEventListener('resize',function(){sizeWheel();draw();});
  window.addEventListener('orientationchange',function(){setTimeout(function(){sizeWheel();draw();},250);});

  function init(){sizeWheel();buildStock();draw();}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}
  else{init();}
  setTimeout(function(){sizeWheel();draw();},300);
  setTimeout(function(){sizeWheel();draw();},900);
  setTimeout(function(){sizeWheel();draw();},2000);
})();
</script>
</body>
</html>
